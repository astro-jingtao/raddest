name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run ruff check (required gate)
        # Pinned to the dev environment's ruff: a newer release could inject
        # findings into the selected rule families and flake the gate.
        run: |
          pip install ruff==0.17.3
          ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 pinned: ubuntu-latest (26.04) has no setup-python
          # distribution for 3.9 any more.
          - os: ubuntu-24.04
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          # No windows leg: the ndtest git dependency's f2py build cannot be
          # satisfied here — its setup.py unconditionally moves a `.libs`
          # directory that the meson f2py backend (forced on py3.12+ and
          # setuptools>=74, i.e. every current runner) never creates. The fix
          # belongs to ndtest's packaging; restore this leg once ndtest builds
          # under the meson backend on Windows.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Ensure a Fortran compiler (macOS, for the ndtest f2py build)
        if: runner.os == 'macOS'
        run: command -v gfortran || brew install gfortran

      - name: Install package and test dependencies
        # CPU-only jax: no CUDA wheels needed, the extra keeps the runners light.
        # ndtest (the git dependency) imports numpy in its setup.py and has no
        # pyproject.toml, so an isolated build env has neither numpy (its import
        # fails at metadata time) nor a way to read maxdist.f90's UTF-8 comment
        # (numpy's f2py opens sources as ASCII unless charset_normalizer is
        # installed). Everything therefore builds with --no-build-isolation
        # against the pre-installed tools: numpy, charset_normalizer, meson and
        # ninja for the f2py extension (meson backend on py3.12+ /
        # setuptools>=74; the Fortran compiler comes from the runner image),
        # and pted's hatchling build requirements. pip >= 25.3 rebuilds the
        # direct-URL ndtest requirement from requirements-dev.txt even after the
        # pre-install, so the last command must carry the flag too.
        run: |
          python -m pip install --upgrade pip
          pip install numpy setuptools wheel meson ninja charset_normalizer hatchling hatch-requirements-txt hatch-vcs
          pip install --no-build-isolation "ndtest @ git+https://github.com/astro-jingtao/ndtest"
          pip install --no-build-isolation -e . -r requirements-dev.txt
      - name: Run fast test subset
        # CI runners have no GPU and 2 cores; the slow marker excludes the
        # end-to-end fitting tests (flow training, grid searches, gradient
        # fits) that take minutes each on such machines.
        run: pytest -m "not slow" -q
